[notifications]
toast_duration_secs = 8

[privacy]
telemetry_enabled = false
crash_reporting_enabled = false

[agents]
cloud_conversation_storage_enabled = true

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.input]
nld_in_terminal_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true
show_conversation_history = true

[agents.third_party]
should_render_cli_agent_toolbar = false

[agents.execution_profiles]

[agents.execution_profiles.default]
apply_code_diffs = "always_ask"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
base_model = "auto-genius"
command_allowlist = []
command_denylist = [
  'bash(\s.*)?',
  'fish(\s.*)?',
  'pwsh(\s.*)?',
  'sh(\s.*)?',
  'zsh(\s.*)?',
  'curl(\s.*)?',
  'eval(\s.*)?',
  'exec(\s.*)?',
  'source(\s.*)?',
  'wget(\s.*)?',
  'dig(\s.*)?',
  'nslookup(\s.*)?',
  'host(\s.*)?',
  'ssh(\s.*)?',
  'scp(\s.*)?',
  'rsync(\s.*)?',
  'telnet(\s.*)?',
  'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "agent_decides"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "always_allow"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_ask"

[terminal]

[terminal.input]
input_box_type_setting = "universal"

[appearance]

[appearance.text]
ai_font_name = "UbuntuMono Nerd Font Propo"
font_name = "UbuntuMono Nerd Font Mono"
font_size = 22.0
notebook_font_size = 14.0
match_ai_font = false

[appearance.vertical_tabs]
enabled = false

[appearance.tabs]

[appearance.window]
zoom_level = 90

[appearance.themes]
theme = "gruvbox_dark"

[appearance.icon]
show_dock_icon = true

[general]
default_session_mode = "agent"

[account]
is_settings_sync_enabled = true

[workflows]

[warp_drive]
enabled = true

[code]

[code.editor]
show_code_review_button = true
show_project_explorer = true
show_global_search = true
