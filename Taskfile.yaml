version: '3'

includes:
  codex:
    taskfile: platform/container/workspace/tools/codex-llmbox-provider/Taskfile.yaml
    dir: platform/container/workspace/tools/codex-llmbox-provider

vars:
  WORKSPACE_IMAGE: platform/container/workspace
  ASR_SERVICE: platform/container/services/asr

tasks:
  default:
    desc: 列出所有可用 task
    cmds:
      - task --list
    silent: true

  sync:
    desc: 按 lock 同步控制面与 Go 依赖
    cmds:
      - uv sync --locked
      - cd {{.WORKSPACE_IMAGE}} && go mod download

  serve:
    desc: 前台启动控制面
    cmds:
      - uv run codespace serve

  serve:bg:
    desc: 后台启动控制面
    cmds:
      - scripts/run-control-plane.sh

  format:
    desc: 格式化 Python、Go 与 Shell
    cmds:
      - uv run ruff format src tests {{.ASR_SERVICE}}
      - cd {{.WORKSPACE_IMAGE}} && go tool goimports -w agent tools
      - >-
        find {{.ASR_SERVICE}}/models -maxdepth 2 -type f -name run -print0 |
        xargs -0 shfmt -w -i 2 -ci
        {{.ASR_SERVICE}}/scheduler/run {{.ASR_SERVICE}}/models/rootfs/usr/local/bin/asr-start
      - >-
        find {{.ASR_SERVICE}}/models/rootfs -type f -name finish -print0 |
        xargs -0 shfmt -w -i 2 -ci
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shfmt -w -i 2 -ci "$1"' sh

  format:check:
    desc: 检查 Python、Go 与 Shell 格式
    cmds:
      - uv run ruff format --check src tests {{.ASR_SERVICE}}
      - cd {{.WORKSPACE_IMAGE}} && test -z "$(go tool goimports -l agent tools)"
      - >-
        find {{.ASR_SERVICE}}/models -maxdepth 2 -type f -name run -print0 |
        xargs -0 shfmt -d -i 2 -ci
        {{.ASR_SERVICE}}/scheduler/run {{.ASR_SERVICE}}/models/rootfs/usr/local/bin/asr-start
      - >-
        find {{.ASR_SERVICE}}/models/rootfs -type f -name finish -print0 |
        xargs -0 shfmt -d -i 2 -ci
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shfmt -d -i 2 -ci "$1"' sh

  lint:
    desc: 运行 Ruff、Go lint 与 ShellCheck
    cmds:
      - uv run ruff check src tests {{.ASR_SERVICE}}
      - cd {{.WORKSPACE_IMAGE}} && go tool golangci-lint run --allow-serial-runners
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shellcheck -x "$1"' sh
      - >-
        find {{.ASR_SERVICE}}/models -maxdepth 2 -type f -name run -print0 |
        xargs -0 shellcheck
        {{.ASR_SERVICE}}/scheduler/run {{.ASR_SERVICE}}/models/rootfs/usr/local/bin/asr-start
      - >-
        find {{.ASR_SERVICE}}/models/rootfs -type f -name finish -print0 |
        xargs -0 shellcheck

  typecheck:
    desc: 运行 strict Mypy 与 Go vet
    cmds:
      - uv run mypy --no-incremental src/codespace
      - cd {{.WORKSPACE_IMAGE}} && go vet ./...
      - >-
        MYPYPATH={{.ASR_SERVICE}} uv run --project {{.ASR_SERVICE}}/scheduler mypy --strict --no-incremental
        {{.ASR_SERVICE}}/scheduler {{.ASR_SERVICE}}/models/audio.py
        {{.ASR_SERVICE}}/models/engine.py {{.ASR_SERVICE}}/models/start.py {{.ASR_SERVICE}}/protocol.py {{.ASR_SERVICE}}/execution.py
        {{.ASR_SERVICE}}/client/asr.py {{.ASR_SERVICE}}/models/vllm.py {{.ASR_SERVICE}}/regression/run.py

  test:
    desc: 运行控制面、Go 与 macOS installer 测试
    deps:
      - task: test:python
      - task: test:shell
      - task: test:go

  test:python:
    internal: true
    cmds:
      - uv run pytest
      - uv run --project {{.ASR_SERVICE}}/scheduler pytest -c {{.ASR_SERVICE}}/scheduler/pyproject.toml {{.ASR_SERVICE}}/tests

  test:go:
    internal: true
    cmds:
      - cd {{.WORKSPACE_IMAGE}} && go test -race -cover ./...

  test:shell:
    internal: true
    cmds:
      - >-
        find platform/macos/tests -type f -name '*.bats' -print0 |
        xargs -0 -P 6 -n 1 bats

  lock:check:
    desc: 校验 uv 与 Go lock
    cmds:
      - uv lock --check
      - cd {{.WORKSPACE_IMAGE}} && go mod tidy -diff
      - cd {{.WORKSPACE_IMAGE}} && go mod verify
      - uv lock --project {{.ASR_SERVICE}}/scheduler --check
      - >-
        for model in {{.ASR_SERVICE}}/models/*/pyproject.toml; do
          uv lock --project "$(dirname "$model")" --check || exit;
        done

  check:
    desc: 运行快速本地检查，不含测试
    deps:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: lock:check

  security:go:
    desc: 扫描 Go executable 漏洞
    cmds:
      - cd {{.WORKSPACE_IMAGE}} && go tool govulncheck ./...

  check:full:
    desc: 运行完整本地与 CI 检查
    deps:
      - task: check
      - task: test
      - task: security:go
      - task: codex:build

  secrets:sync:
    desc: 同步 Podman secrets，默认 dry-run
    cmds:
      - uv run codespace secrets sync {{.CLI_ARGS}}

  resources:sync:
    desc: 创建并填充 codespace-resource 数据卷，默认 dry-run
    cmds:
      - uv run codespace resources sync {{.CLI_ARGS}}

  workspaces:prune:
    desc: 清理残留 Workspace 数据，默认 dry-run
    cmds:
      - uv run codespace workspaces prune {{.CLI_ARGS}}

  deploy-keys:prune:
    desc: 清理未使用的 deploy keys，默认 dry-run
    cmds:
      - uv run codespace deploy-keys prune {{.CLI_ARGS}}
