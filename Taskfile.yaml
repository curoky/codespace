version: '3'

vars:
  WORKSPACE_AGENT: platform/container/workspace/agent
  WORKSPACE_IMAGE: platform/container/workspace

tasks:
  default:
    desc: 列出所有可用 task
    cmds:
      - task --list
    silent: true

  sync:
    desc: 按 lock 同步控制面与 Workspace Agent 依赖
    cmds:
      - uv sync --locked
      - uv sync --project {{.WORKSPACE_AGENT}} --locked --no-dev

  serve:
    desc: 前台启动控制面
    cmds:
      - uv run codespace serve

  serve:bg:
    desc: 后台启动控制面
    cmds:
      - scripts/run-control-plane.sh

  format:
    desc: 格式化 Python 与 Shell
    cmds:
      - uv run ruff format src tests {{.WORKSPACE_AGENT}}/agent.py
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shfmt -w -i 2 -ci "$1"' sh

  format:check:
    desc: 检查 Python 与 Shell 格式
    cmds:
      - uv run ruff format --check src tests {{.WORKSPACE_AGENT}}/agent.py
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shfmt -d -i 2 -ci "$1"' sh

  lint:
    desc: 运行 Ruff 与 ShellCheck
    cmds:
      - uv run ruff check src tests {{.WORKSPACE_AGENT}}/agent.py
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shellcheck -x "$1"' sh

  typecheck:
    desc: 运行 strict Mypy
    cmds:
      - MYPYPATH={{.WORKSPACE_AGENT}} uv run mypy src/codespace {{.WORKSPACE_AGENT}}/agent.py
      - >-
        cd {{.WORKSPACE_AGENT}} &&
        uv run --locked python -c "import agent"

  test:
    desc: 运行控制面与 macOS installer 测试
    deps:
      - task: test:python
      - task: test:shell

  test:python:
    internal: true
    cmds:
      - uv run pytest

  test:shell:
    internal: true
    cmds:
      - >-
        find platform/macos/tests -type f -name '*.bats' -print0 |
        xargs -0 -P 6 -n 1 bats

  lock:check:
    desc: 校验两个 uv lock
    cmds:
      - uv lock --check
      - uv lock --project {{.WORKSPACE_AGENT}} --check

  check:
    desc: 运行快速本地检查，不含测试
    deps:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: lock:check

  check:full:
    desc: 运行完整本地与 CI 检查
    deps:
      - task: check
      - task: test

  secrets:sync:
    desc: 同步 Podman secrets，默认 dry-run
    cmds:
      - uv run codespace secrets sync {{.CLI_ARGS}}

  resources:sync:
    desc: 创建并填充 codespace-resource 数据卷，默认 dry-run
    cmds:
      - uv run codespace resources sync {{.CLI_ARGS}}

  workspaces:prune:
    desc: 清理残留 Workspace 数据，默认 dry-run
    cmds:
      - uv run codespace workspaces prune {{.CLI_ARGS}}

  deploy-keys:prune:
    desc: 清理未使用的 deploy keys，默认 dry-run
    cmds:
      - uv run codespace deploy-keys prune {{.CLI_ARGS}}
