version: '3'

vars:
  JAVA_TOOL: platform/container/workspace/tools/java-tool
  NODE_TOOL: platform/container/workspace/tools/node-tool
  WORKSPACE_AGENT: platform/container/workspace/agent
  WORKSPACE_IMAGE: platform/container/workspace
  ASR_SERVICE: platform/container/services/asr

tasks:
  default:
    desc: 列出所有可用 task
    cmds:
      - task --list
    silent: true

  sync:
    desc: 按 lock 同步控制面与 Workspace Agent 依赖
    cmds:
      - uv sync --locked
      - uv sync --project {{.WORKSPACE_AGENT}} --locked --no-dev

  serve:
    desc: 前台启动控制面
    cmds:
      - uv run codespace serve

  serve:bg:
    desc: 后台启动控制面
    cmds:
      - scripts/run-control-plane.sh

  format:
    desc: 格式化 Python 与 Shell
    cmds:
      - uv run ruff format src tests {{.WORKSPACE_AGENT}}/agent.py {{.JAVA_TOOL}} {{.NODE_TOOL}} {{.ASR_SERVICE}}
      - >-
        find {{.ASR_SERVICE}}/models -maxdepth 2 -type f -name run -print0 |
        xargs -0 shfmt -w -i 2 -ci
        {{.ASR_SERVICE}}/server/run {{.ASR_SERVICE}}/rootfs/usr/local/bin/asr-model-service
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shfmt -w -i 2 -ci "$1"' sh

  format:check:
    desc: 检查 Python 与 Shell 格式
    cmds:
      - uv run ruff format --check src tests {{.WORKSPACE_AGENT}}/agent.py {{.JAVA_TOOL}} {{.NODE_TOOL}} {{.ASR_SERVICE}}
      - >-
        find {{.ASR_SERVICE}}/models -maxdepth 2 -type f -name run -print0 |
        xargs -0 shfmt -d -i 2 -ci
        {{.ASR_SERVICE}}/server/run {{.ASR_SERVICE}}/rootfs/usr/local/bin/asr-model-service
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shfmt -d -i 2 -ci "$1"' sh

  lint:
    desc: 运行 Ruff 与 ShellCheck
    cmds:
      - uv run ruff check src tests {{.WORKSPACE_AGENT}}/agent.py {{.JAVA_TOOL}} {{.NODE_TOOL}} {{.ASR_SERVICE}}
      - >-
        git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bats' |
        xargs -0 -P 6 -n 1 sh -c 'test ! -f "$1" || shellcheck -x "$1"' sh
      - >-
        find {{.ASR_SERVICE}}/models -maxdepth 2 -type f -name run -print0 |
        xargs -0 shellcheck
        {{.ASR_SERVICE}}/server/run {{.ASR_SERVICE}}/rootfs/usr/local/bin/asr-model-service

  typecheck:
    desc: 运行 strict Mypy
    cmds:
      - MYPYPATH={{.WORKSPACE_AGENT}} uv run mypy src/codespace {{.WORKSPACE_AGENT}}/agent.py
      - uv run mypy {{.JAVA_TOOL}}/java-tool.py
      - uv run mypy {{.NODE_TOOL}}/node-tool.py
      - >-
        MYPYPATH={{.ASR_SERVICE}} uv run --project {{.ASR_SERVICE}}/server mypy --strict
        {{.ASR_SERVICE}}/server {{.ASR_SERVICE}}/ops {{.ASR_SERVICE}}/protocol.py
        {{.ASR_SERVICE}}/client/asr.py {{.ASR_SERVICE}}/models/catalog.py {{.ASR_SERVICE}}/models/vllm.py
      - >-
        cd {{.WORKSPACE_AGENT}} &&
        uv run --locked python -c "import agent"

  test:
    desc: 运行控制面与 macOS installer 测试
    deps:
      - task: test:python
      - task: test:shell

  test:python:
    internal: true
    cmds:
      - uv run pytest
      - uv run pytest {{.JAVA_TOOL}}/test_java_tool.py --no-cov
      - uv run pytest {{.NODE_TOOL}}/test_node_tool.py --no-cov
      - uv run --project {{.ASR_SERVICE}}/server pytest -c {{.ASR_SERVICE}}/server/pyproject.toml {{.ASR_SERVICE}}/tests

  test:shell:
    internal: true
    cmds:
      - >-
        find platform/macos/tests -type f -name '*.bats' -print0 |
        xargs -0 -P 6 -n 1 bats

  lock:check:
    desc: 校验所有 uv lock
    cmds:
      - uv lock --check
      - uv lock --project {{.WORKSPACE_AGENT}} --check
      - uv lock --project {{.JAVA_TOOL}} --check
      - uv lock --project {{.NODE_TOOL}} --check
      - uv lock --project {{.ASR_SERVICE}}/server --check
      - >-
        for model in {{.ASR_SERVICE}}/models/*/pyproject.toml; do
          uv lock --project "$(dirname "$model")" --check || exit;
        done

  check:
    desc: 运行快速本地检查，不含测试
    deps:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: lock:check

  check:full:
    desc: 运行完整本地与 CI 检查
    deps:
      - task: check
      - task: test

  secrets:sync:
    desc: 同步 Podman secrets，默认 dry-run
    cmds:
      - uv run codespace secrets sync {{.CLI_ARGS}}

  resources:sync:
    desc: 创建并填充 codespace-resource 数据卷，默认 dry-run
    cmds:
      - uv run codespace resources sync {{.CLI_ARGS}}

  workspaces:prune:
    desc: 清理残留 Workspace 数据，默认 dry-run
    cmds:
      - uv run codespace workspaces prune {{.CLI_ARGS}}

  deploy-keys:prune:
    desc: 清理未使用的 deploy keys，默认 dry-run
    cmds:
      - uv run codespace deploy-keys prune {{.CLI_ARGS}}
