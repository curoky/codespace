version: '3'

vars:
  WORKSPACE_AGENT: platform/container/workspace/agent
  WORKSPACE_IMAGE: platform/container/workspace

tasks:
  default:
    desc: 列出所有可用 task
    cmds:
      - task --list
    silent: true

  sync:
    desc: 按 lock 同步控制面与 Workspace Agent 依赖
    cmds:
      - uv sync --locked
      - uv sync --project {{.WORKSPACE_AGENT}} --locked --no-dev

  serve:
    desc: 前台启动控制面
    cmds:
      - uv run codespace serve

  serve:bg:
    desc: 后台启动控制面
    cmds:
      - scripts/run-control-plane.sh

  format:
    desc: 格式化 Python 与 Shell
    cmds:
      - uv run ruff format src tests {{.WORKSPACE_AGENT}}/agent.py
      - git ls-files -z '*.sh' '*.bats' | xargs -0 shfmt -w -i 2 -ci

  format:check:
    desc: 检查 Python 与 Shell 格式
    cmds:
      - uv run ruff format --check src tests {{.WORKSPACE_AGENT}}/agent.py
      - git ls-files -z '*.sh' '*.bats' | xargs -0 shfmt -d -i 2 -ci

  lint:
    desc: 运行 Ruff 与 ShellCheck
    cmds:
      - uv run ruff check src tests {{.WORKSPACE_AGENT}}/agent.py
      - git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck

  typecheck:
    desc: 运行 strict Mypy
    cmds:
      - MYPYPATH={{.WORKSPACE_AGENT}} uv run mypy src/codespace {{.WORKSPACE_AGENT}}/agent.py
      - >-
        cd {{.WORKSPACE_AGENT}} &&
        uv run --locked python -c "import agent"

  test:
    desc: 运行控制面与 Workspace image 测试
    cmds:
      - uv run pytest
      - bats {{.WORKSPACE_IMAGE}}/tests/*.bats

  lock:check:
    desc: 校验两个 uv lock
    cmds:
      - uv lock --check
      - uv lock --project {{.WORKSPACE_AGENT}} --check

  check:
    desc: 运行完整本地与 CI 检查
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test
      - task: lock:check

  secrets:sync:
    desc: 同步 Podman secrets，默认 dry-run
    cmds:
      - uv run codespace secrets sync {{.CLI_ARGS}}

  workspaces:prune:
    desc: 清理残留 Workspace 数据，默认 dry-run
    cmds:
      - uv run codespace workspaces prune {{.CLI_ARGS}}

  deploy-keys:prune:
    desc: 清理未使用的 deploy keys，默认 dry-run
    cmds:
      - uv run codespace deploy-keys prune {{.CLI_ARGS}}

  platform:workspace:
    desc: 构建 Workspace image
    cmds:
      - platform/container/workspace/build.sh {{.CLI_ARGS}}

  platform:support:
    desc: 构建 support Service image
    cmds:
      - platform/container/services/support/build.sh {{.CLI_ARGS}}

  platform:vllm:
    desc: 构建 vLLM Service image
    cmds:
      - platform/container/services/vllm/build.sh {{.CLI_ARGS}}

  platform:sglang:
    desc: 构建 SGLang Service image
    cmds:
      - platform/container/services/sglang/build.sh {{.CLI_ARGS}}

  platform:framework:pytorch:
    desc: 构建 PyTorch framework image
    cmds:
      - platform/container/frameworks/pytorch/build.sh {{.CLI_ARGS}}

  platform:framework:vllm:
    desc: 构建 vLLM framework image
    cmds:
      - platform/container/frameworks/vllm/build.sh {{.CLI_ARGS}}

  platform:framework:sglang:
    desc: 构建 SGLang framework image
    cmds:
      - platform/container/frameworks/sglang/build.sh {{.CLI_ARGS}}

  platform:wsl:
    desc: 构建 WSL image
    cmds:
      - platform/wsl/build.sh {{.CLI_ARGS}}

  platform:wsl:export:
    desc: 导出 WSL rootfs
    cmds:
      - platform/wsl/export.sh {{.CLI_ARGS}}

  platform:macos:install:
    desc: 安装 macOS host 配置
    cmds:
      - platform/macos/install.sh {{.CLI_ARGS}}

  platform:macos:atuin-server:
    desc: 安装 macOS host 配置并启用本地 Atuin server
    cmds:
      - platform/macos/install.sh --with-atuin-server

  platform:linux:install:
    desc: 安装 Linux host 配置
    cmds:
      - platform/linux/install.sh {{.CLI_ARGS}}
