# WSL per-distribution configuration, baked into the exported rootfs at
# /etc/wsl.conf and parsed by WSL's /init (PID 1) on every start.
#
# Note: `wsl --import` does NOT run any OOBE, so the default user must be set
# here (the user `x`, uid 5230, already exists in the exported rootfs).

[user]
default = x

[boot]
# Bring up the minimal s6 supervision tree (sshd). Runs as root, asynchronously,
# so the foreground supervision process does not block login.
command = /opt/codespace/wsl/boot.sh

[automount]
# We do not rely on Windows drives for the dev workflow; keep the default mount
# but do not process /etc/fstab surprises.
enabled = true

[interop]
# Keep Windows interop available but do not pollute the Linux PATH with the
# (very long) Windows PATH inside the dev shell.
enabled = true
appendWindowsPath = false
