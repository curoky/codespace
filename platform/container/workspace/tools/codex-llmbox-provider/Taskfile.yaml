version: '3'

tasks:
  default:
    desc: 列出 provider 任务
    cmds: [task --list]
    silent: true

  build:
    desc: 构建 provider 二进制
    cmds:
      - go build -mod=readonly -trimpath -o bin/codex-llmbox-provider .

  login:
    desc: OAuth Device Flow 登录
    cmds:
      - bin/codex-llmbox-provider login {{.CLI_ARGS}}

  models:
    desc: 查询 native catalog
    cmds:
      - bin/codex-llmbox-provider models {{.CLI_ARGS}}
