approval_policy = "never"
approvals_reviewer = "user"
commit_attribution = ""
default_permissions = ":danger-full-access"
model = "GPT-6.1-Sol"
model_provider = "trae"
model_reasoning_effort = "high"
seed_super_relay_enabled = true
service_tier = "priority"

[analytics]
enabled = false

[auto_review]
enabled = false

[features]
guardian_v2 = false

[notice]
hide_full_access_warning = true

[plugins."ai-contribution@traex-bd-plugins"]
enabled = false

[projects."/workspace"]
trust_level = "trusted"

[trae_telemetry]
endpoint_override = "http://127.0.0.1:1"
verbose = 0
