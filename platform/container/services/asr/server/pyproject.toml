[project]
name = "asr-server"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "PyYAML==6.0.3",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
  "typer==0.27.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8", "types-PyYAML>=6.0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".."]
addopts = "--import-mode=importlib"
