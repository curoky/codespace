<script>
const trace=JSON.parse(document.getElementById('trace-data').textContent);
const events=trace.events.slice().sort((a,b)=>a.started_ms-b.started_ms);
const seconds=ms=>(ms/1000).toFixed(3);
const node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
const svgNode=(tag,attrs)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n};
document.getElementById('summary').textContent=`${trace.status} · ${seconds(trace.duration_ms)} s · ${events.filter(e=>e.kind==='model').length} model calls`;
for(const key of ['recipe','model'])for(const value of [...new Set(events.map(e=>e[key]).filter(Boolean))].sort()){const option=node('option',value);option.value=value;document.getElementById(key).append(option)}
function render(){
 const recipe=document.getElementById('recipe').value,model=document.getElementById('model').value;
 const selected=events.filter(e=>(!recipe||e.recipe===recipe)&&(!model||e.model===model));
 const timeline=document.getElementById('timeline'),calls=document.getElementById('calls');timeline.replaceChildren();calls.replaceChildren();
 const width=1200,labelWidth=330,scale=(width-labelWidth)/Math.max(trace.duration_ms,1);
 const svg=svgNode('svg',{viewBox:`0 0 ${width} ${Math.max(40,selected.length*28+30)}`});timeline.append(svg);
 for(let i=0;i<=4;i++){const x=labelWidth+i*(width-labelWidth)/4;svg.append(svgNode('line',{x1:x,x2:x,y1:20,y2:selected.length*28+30,stroke:'#304158'}));const label=svgNode('text',{x,y:14,fill:'#9fb0c6','font-size':11});label.textContent=seconds(trace.duration_ms*i/4);svg.append(label)}
 selected.forEach((e,i)=>{
  const show=()=>document.getElementById('details').textContent=JSON.stringify(e,null,2);
  const y=30+i*28,x=labelWidth+e.started_ms*scale;
  const label=svgNode('text',{x:0,y:y+13,fill:'#dce5ef','font-size':11});label.textContent=`${e.recipe||'request'} · ${e.model||e.name}${e.channel&&e.channel!=='None'?' · track '+e.channel:''}`;svg.append(label);
  const bar=svgNode('rect',{x,y,width:Math.max(1,e.duration_ms*scale),height:18,fill:e.kind==='model'?'#38b785':'#558bd6'});bar.addEventListener('click',show);svg.append(bar);
  if(e.model_queue_ms){const queue=svgNode('rect',{x,y,width:e.model_queue_ms*scale,height:18,fill:'#d2a743'});queue.addEventListener('click',show);svg.append(queue)}
  const row=node('tr');for(const value of [e.recipe||'request',e.model||e.name,seconds(e.started_ms),seconds(e.model_queue_ms||0),seconds(e.inference_ms||0),seconds(e.duration_ms)])row.append(node('td',value));row.addEventListener('click',show);calls.append(row);
 });
}
for(const key of ['recipe','model'])document.getElementById(key).addEventListener('change',render);
document.getElementById('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(trace,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download='trace.json';a.click();URL.revokeObjectURL(url)});
render();
</script>
