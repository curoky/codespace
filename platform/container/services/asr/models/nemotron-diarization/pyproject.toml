[project]
name = "asr-model-nemotron-diarization"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub==0.36.2",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "soundfile>=0.13.1",
  # PyPI 3.0.0 缺少 checkpoint 使用的 RoPE encoder 与 auxiliary diarization losses。
  "nemo-toolkit[asr] @ git+https://github.com/NVIDIA-NeMo/NeMo@ca3f93a516ff172e32951928aea6f96a977a7600",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "transformers==4.57.6"
]

[tool.uv]
package = false
# 上游 revision 的 uv source matrix 仅在部署目标 Linux x86_64 上解析一致。
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
