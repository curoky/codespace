hosts:
  workstation:
    forward_environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    container:
      devices: [/dev/fuse, /dev/net/tun]
      volumes:
        - /etc/krb5.conf:/etc/krb5.conf:ro

  gpu-host:
    forward_environment: [HOST_IP, HOST_IPV6]
    container:
      devices: [nvidia.com/gpu=all, /dev/fuse, /dev/net/tun]
      volumes:
        - /etc/krb5.conf:/etc/krb5.conf:ro
        - /opt/tmp:/opt/tmp

project_defaults:
  resource_image: ghcr.io/curoky/codespace:workspace-resource
  encrypted: true
  tunnel_ports: [8007, 8008]
  container:
    image: ghcr.io/curoky/codespace:workspace-debian13
    platform: linux/amd64
    pull_policy: always
    network_mode: bridge
    privileged: true
    secrets:
      - { source: codespace_root_password, uid: "0", gid: "0", mode: 0400 }
      - { source: codespace_workspace_key, uid: "5230", gid: "5230", mode: 0400 }
      - { source: huggingface_token, uid: "5230", gid: "5230", mode: 0400 }
      - { source: atuin_db_uri, uid: "5230", gid: "5230", mode: 0400 }
      - { source: github_action_token, uid: "5230", gid: "5230", mode: 0400 }
    cap_add: [NET_RAW, SYS_ADMIN]
    security_opt: [label=disable, seccomp=unconfined, apparmor=unconfined]
    pids_limit: -1
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - codespace-resource:/opt/resource:ro
      - ${RESOURCE_DATA}/workspace:/workspace.enc
      - ${RESOURCE_DATA}/podman:/opt/podman/data
      - ${RESOURCE_DATA}/control:/run/codespace-control
      - ${RESOURCE_DATA}/cache/.vscode-server/cli:/home/x/.vscode-server/cli
      - ${RESOURCE_DATA}/cache/.vscode-server/extensions:/home/x/.vscode-server/extensions
      - ${RESOURCE_DATA}/cache/.trae/bin:/home/x/.trae/bin
      - ${RESOURCE_DATA}/cache/.trae/extensions:/home/x/.trae/extensions
      - ${RESOURCE_DATA}/cache/.trae-cn/bin:/home/x/.trae-cn/bin
      - ${RESOURCE_DATA}/cache/.trae-cn/extensions:/home/x/.trae-cn/extensions
      - ${RESOURCE_DATA}/cache/.trae-server/bin:/home/x/.trae-server/bin
      - ${RESOURCE_DATA}/cache/.trae-server/extensions:/home/x/.trae-server/extensions
      - ${RESOURCE_DATA}/cache/.trae-cn-server/bin:/home/x/.trae-cn-server/bin
      - ${RESOURCE_DATA}/cache/.trae-cn-server/extensions:/home/x/.trae-cn-server/extensions

projects:
  codespace:
    description: Personal development platform
    source: { type: github, repository: curoky/codespace }
    hosts: [workstation, gpu-host]

  learn-ml:
    source: { type: github, repository: curoky/learn-ml }
    hosts: [gpu-host]

  standalone-binaries:
    source: { type: github, repository: curoky/standalone-binaries }
    hosts: [gpu-host]
    encrypted: false
    container:
      volumes:
        - ${RESOURCE_DATA}/workspace:/workspace

  notes:
    source: { type: gitlab, repository: my-namespace/notes }
    hosts: [workstation]

  scratch:
    source: { type: empty }
    hosts: [gpu-host]
    open_path: /workspace

  private-repo:
    source: { type: git, url: "git@git.example.com:team/private-repo" }
    hosts: [gpu-host]
    encrypted: false
    container:
      image: registry.example.com/base/dev-image:latest
      volumes:
        - ${RESOURCE_DATA}/workspace:/workspace

services:
  support:
    hosts: [workstation, gpu-host]
    tunnel_ports: [8008]
    container:
      image: ghcr.io/curoky/codespace:service-support
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      restart: unless-stopped
      volumes:
        - /run/podman/podman.sock:/run/podman/podman.sock

  secret:
    hosts: [workstation, gpu-host]
    tunnel_ports: [8008]
    container:
      image: ghcr.io/curoky/codespace:service-secret
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      restart: unless-stopped

  vllm:
    hosts: [gpu-host]
    tunnel_ports: [8080, 8008]
    container:
      image: ghcr.io/curoky/codespace:service-vllm
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      restart: unless-stopped
      ipc: host
      pids_limit: -1
      devices: [nvidia.com/gpu=all]
      volumes:
        - ${RESOURCE_DATA}:/home/x/.cache/huggingface
      secrets:
        - { source: huggingface_token, uid: "5230", gid: "5230", mode: 0400 }

  sglang:
    hosts: [gpu-host]
    tunnel_ports: [8080, 8008]
    container:
      image: ghcr.io/curoky/codespace:service-sglang
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      restart: unless-stopped
      ipc: host
      pids_limit: -1
      devices: [nvidia.com/gpu=all]
      volumes:
        - ${RESOURCE_DATA}:/home/x/.cache/huggingface
      secrets:
        - { source: huggingface_token, uid: "5230", gid: "5230", mode: 0400 }

  chatbox:
    hosts: [gpu-host]
    tunnel_ports: [8080, 8008]
    container:
      image: ghcr.io/curoky/codespace:service-chatbox
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      restart: unless-stopped

tokens:
  github: github_pat_REPLACE_WITH_GITHUB_TOKEN
  gitlab: glpat-REPLACE_WITH_GITLAB_TOKEN

secrets:
  codespace_root_password: REPLACE_WITH_ROOT_PASSWORD
  codespace_workspace_key: REPLACE_WITH_WORKSPACE_ENCRYPTION_KEY
  huggingface_token: hf_REPLACE_WITH_HUGGINGFACE_TOKEN
  atuin_db_uri: postgres://user:REPLACE_WITH_PASSWORD@db.example.com:5432/postgres
  github_action_token: github_pat_REPLACE_WITH_GITHUB_ACTION_TOKEN
