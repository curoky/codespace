hosts:
  workstation:
    bridge_gateway: 10.88.0.1
    forward_environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    platform: linux/amd64
    container:
      devices: [/dev/fuse]
      volumes:
        - /etc/krb5.conf:/etc/krb5.conf:ro

  gpu-host:
    bridge_gateway: 10.88.0.1
    forward_environment: [HOST_IP, HOST_IPV6]
    platform: linux/amd64
    container:
      devices: [nvidia.com/gpu=all, /dev/fuse]
      volumes:
        - /etc/krb5.conf:/etc/krb5.conf:ro
        - /opt/tmp:/opt/tmp

project_defaults:
  image: ghcr.io/curoky/codespace:workspace-debian13
  tunnel_ports: [8007, 8008]
  container:
    environment:
      CODESPACE_ENCRYPTED_PATH: /workspace.enc
      KRB5CCNAME: /tmp/krb5_ccache
      CODESPACE_SECRET_URL: http://10.88.0.1:8006
    secrets:
      - { source: huggingface_token, mode: 0400 }
      - { source: atuin_db_uri, mode: 0400 }
      - { source: github_action_token, uid: "5230", gid: "5230", mode: 0400 }
      - { source: secret_webdav_password, uid: "5230", gid: "5230", mode: 0400 }
    cap_add: [NET_RAW, SYS_ADMIN]
    security_opt: [disable, seccomp=unconfined]
    pids_limit: -1
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - ${RESOURCE_DATA}/workspace:/workspace
      - ${RESOURCE_DATA}/upload:/upload
      - ${RESOURCE_DATA}/control:/run/codespace-control
      - ${RESOURCE_DATA}/cache/.vscode-server/bin:/home/x/.vscode-server/bin
      - ${RESOURCE_DATA}/cache/.vscode-server/extensions:/home/x/.vscode-server/extensions
      - ${RESOURCE_DATA}/cache/.trae/bin:/home/x/.trae/bin
      - ${RESOURCE_DATA}/cache/.trae/extensions:/home/x/.trae/extensions
      - ${RESOURCE_DATA}/cache/.trae-cn/bin:/home/x/.trae-cn/bin
      - ${RESOURCE_DATA}/cache/.trae-cn/extensions:/home/x/.trae-cn/extensions
      - ${RESOURCE_DATA}/cache/.trae-server/bin:/home/x/.trae-server/bin
      - ${RESOURCE_DATA}/cache/.trae-server/extensions:/home/x/.trae-server/extensions
      - ${RESOURCE_DATA}/cache/.trae-cn-server/bin:/home/x/.trae-cn-server/bin
      - ${RESOURCE_DATA}/cache/.trae-cn-server/extensions:/home/x/.trae-cn-server/extensions

projects:
  codespace:
    description: Personal development platform
    source: { type: github, repository: curoky/codespace }
    hosts:
      workstation: {}
      gpu-host: {}
    encrypted: true

  learn-ml:
    source: { type: github, repository: curoky/learn-ml }
    hosts:
      gpu-host: {}
    encrypted: true

  standalone-binaries:
    source: { type: github, repository: curoky/standalone-binaries }
    hosts:
      gpu-host: {}
    encrypted: false

  notes:
    source: { type: gitlab, repository: my-namespace/notes }
    hosts:
      workstation: {}
    encrypted: true

  scratch:
    source: { type: empty }
    hosts:
      gpu-host: {}
    encrypted: true
    open_path: /workspace

  private-repo:
    source: { type: git, url: "git@git.example.com:team/private-repo" }
    hosts:
      gpu-host: {}
    encrypted: false
    image: registry.example.com/base/dev-image:latest
    container:
      secrets: []

services:
  support:
    image: ghcr.io/curoky/codespace:service-support
    hosts:
      workstation: {}
      gpu-host: {}
    container:
      volumes:
        - /run/podman/podman.sock:/run/podman/podman.sock

  secret:
    image: ghcr.io/curoky/codespace:service-secret
    hosts:
      workstation: {}
      gpu-host: {}
    container:
      ports:
        - { target: 8080, published: 8006, host_ip: 10.88.0.1 }
      secrets:
        - { source: secret_webdav_password, mode: 0400 }
      volumes:
        - /home/x/vault/keys:/srv/keys:ro
        - /home/x/vault/notes:/srv/notes:ro

  vllm:
    image: ghcr.io/curoky/codespace:service-vllm
    hosts:
      gpu-host: {}
    container:
      ports:
        - { target: 8080, published: 8003, host_ip: 10.88.0.1 }
      ipc: host
      pids_limit: -1
      devices: [nvidia.com/gpu=all]
      environment:
        HF_HOME: /root/.cache/huggingface
        HF_TOKEN_PATH: /run/secrets/huggingface_token
      volumes:
        - ${RESOURCE_DATA}:/root/.cache/huggingface
      secrets:
        - { source: huggingface_token, mode: 0400 }

  sglang:
    image: ghcr.io/curoky/codespace:service-sglang
    hosts:
      gpu-host: {}
    container:
      ports:
        - { target: 8080, published: 8003, host_ip: 10.88.0.1 }
      ipc: host
      pids_limit: -1
      devices: [nvidia.com/gpu=all]
      environment:
        HF_HOME: /root/.cache/huggingface
        HF_TOKEN_PATH: /run/secrets/huggingface_token
      volumes:
        - ${RESOURCE_DATA}:/root/.cache/huggingface
      secrets:
        - { source: huggingface_token, mode: 0400 }

  lobehub:
    image: ghcr.io/curoky/codespace:service-lobehub
    hosts:
      gpu-host: {}
    container:
      ports:
        - { target: 8080, published: 3210, host_ip: 10.88.0.1 }
      environment:
        APP_URL: http://localhost:3210
        OPENAI_PROXY_URL: http://10.88.0.1:8003/v1
      volumes:
        - ${RESOURCE_DATA}:/var/lib/codespace/lobehub

  chatbox:
    image: ghcr.io/curoky/codespace:service-chatbox
    hosts:
      gpu-host: {}
    container:
      ports:
        - { target: 8080, published: 3212, host_ip: 10.88.0.1 }
      environment:
        CHATBOX_API_UPSTREAM: http://10.88.0.1:8003

tokens:
  github: github_pat_REPLACE_WITH_GITHUB_TOKEN
  gitlab: glpat-REPLACE_WITH_GITLAB_TOKEN

secrets:
  codespace_workspace_key: REPLACE_WITH_WORKSPACE_ENCRYPTION_KEY
  huggingface_token: hf_REPLACE_WITH_HUGGINGFACE_TOKEN
  atuin_db_uri: postgres://user:REPLACE_WITH_PASSWORD@db.example.com:5432/postgres
  github_action_token: github_pat_REPLACE_WITH_GITHUB_ACTION_TOKEN
  secret_webdav_password: REPLACE_WITH_SECRET_WEBDAV_PASSWORD
