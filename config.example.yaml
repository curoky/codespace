hosts:
  cpu:
    container:
      devices: [/dev/fuse, /dev/net/tun]
      volumes:
        - /etc/krb5.conf:/etc/krb5.conf:ro

  gpu-h100:
    forward_environment: [MY_HOST_IP, MY_HOST_IPV6]
    container:
      devices: [nvidia.com/gpu=all, /dev/fuse, /dev/net/tun]
      volumes:
        - /etc/krb5.conf:/etc/krb5.conf:ro
        - /opt/tmp:/opt/tmp
        - /opt/[[mask]]/cores:/opt/[[mask]]/cores
        - /tmp/metric.sock:/tmp/metric.sock
        - /usr/local/[[mask]]:/usr/local/[[mask]]:ro

  gpu-a10:
    forward_environment: [MY_HOST_IP, MY_HOST_IPV6]
    container:
      devices: [nvidia.com/gpu=all, /dev/fuse, /dev/net/tun]
      volumes:
        - /etc/krb5.conf:/etc/krb5.conf:ro
        - /opt/tmp:/opt/tmp
        - /opt/[[mask]]/cores:/opt/[[mask]]/cores
        - /tmp/metric.sock:/tmp/metric.sock
        - /usr/local/[[mask]]:/usr/local/[[mask]]:ro

project_defaults:
  encrypted: true
  tunnel_ports: [8007, 8008]
  resource_image: ghcr.io/curoky/codespace:workspace-resource
  container:
    image: ghcr.io/curoky/codespace:workspace-debian13
    platform: linux/amd64
    pull_policy: always
    network_mode: bridge
    privileged: true
    restart: unless-stopped
    environment:
      PATH: /opt/bm/bin:/opt/bm/profile/s6/bin:/opt/bm/profile/s6/libexec:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    secrets:
      - {source: codespace_root_password, uid: '0', gid: '0', mode: 0400}
      - {source: codespace_workspace_key, uid: '5230', gid: '5230', mode: 0400}
      - {source: huggingface_token, uid: '5230', gid: '5230', mode: 0400}
      - {source: atuin_credentials, uid: '5230', gid: '5230', mode: 0400}
      - {source: github_action_token, uid: '5230', gid: '5230', mode: 0400}
      - {source: github_token_public_read, uid: '5230', gid: '5230', mode: 0400}
      - {source: github_token_all_read, uid: '5230', gid: '5230', mode: 0400}
      - {source: github_token_all_action_rw, uid: '5230', gid: '5230', mode: 0400}
    cap_add: [NET_RAW, SYS_ADMIN]
    security_opt: [label=disable, seccomp=unconfined, apparmor=unconfined]
    pids_limit: -1
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes:
      - codespace-resource:/opt/resource:ro
      - ${RESOURCE_DATA}/workspace:/workspace.enc
      - ${RESOURCE_DATA}/podman:/opt/podman/data
      - ${RESOURCE_DATA}/control:/run/codespace-control
      # - ${RESOURCE_DATA}/cache/.local/share/traex:/home/x/.local/share/traex
      - ${RESOURCE_DATA}/cache/.vscode-server/cli:/home/x/.vscode-server/cli
      - ${RESOURCE_DATA}/cache/.vscode-server/extensions:/home/x/.vscode-server/extensions
      # - ${RESOURCE_DATA}/cache/.vscode-server/data:/home/x/.vscode-server/data
      - ${RESOURCE_DATA}/cache/.trae/bin:/home/x/.trae/bin
      - ${RESOURCE_DATA}/cache/.trae-cn/bin:/home/x/.trae-cn/bin
      - ${RESOURCE_DATA}/cache/.trae-server/bin:/home/x/.trae-server/bin
      - ${RESOURCE_DATA}/cache/.trae-server/extensions:/home/x/.trae-server/extensions
      - ${RESOURCE_DATA}/cache/.trae-cn-server/bin:/home/x/.trae-cn-server/bin
      - ${RESOURCE_DATA}/cache/.trae-cn-server/extensions:/home/x/.trae-cn-server/extensions

projects:
  codespace:
    source: [{type: github, repository: curoky/codespace}]
    hosts: [cpu, gpu-h100]

  standalone-binaries:
    source: [{type: github, repository: curoky/standalone-binaries}]
    hosts: [gpu-h100]

  automation:
    source: [{type: github, repository: curoky/automation}]
    hosts: [cpu]

  agent-playbook:
    source: [{type: github, repository: curoky/agent-playbook}]
    hosts: [cpu]

  private-repo:
    source: [{ type: git, url: "git@git.example.com:team/private-repo" }]
    hosts: [cpu]
    encrypted: false
    container:
      image: registry.example.com/base/dev-image:latest
      volumes:
        - ${RESOURCE_DATA}/workspace:/workspace

services:
  support:
    hosts: [cpu, gpu-h100]
    tunnel_ports: [8008]
    container:
      image: ghcr.io/curoky/codespace:service-support
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      volumes:
        - /run/podman/podman.sock:/run/podman/podman.sock

      restart: unless-stopped

  secret:
    hosts: [cpu, gpu-h100]
    tunnel_ports: [8008, 8081]
    container:
      image: ghcr.io/curoky/codespace:service-secret
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      restart: unless-stopped

  vllm:
    hosts: [gpu-h100]
    tunnel_ports: [8080, 8008]
    container:
      image: ghcr.io/curoky/codespace:service-vllm
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      ipc: host
      pids_limit: -1
      devices: [nvidia.com/gpu=all]
      volumes:
        - ${RESOURCE_DATA}:/home/x/.cache/huggingface
      secrets:
        - {source: huggingface_token, uid: '5230', gid: '5230', mode: 0400}
      restart: unless-stopped

  sglang:
    hosts: [gpu-h100]
    tunnel_ports: [8080, 8008]
    container:
      image: ghcr.io/curoky/codespace:service-sglang
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      ipc: host
      pids_limit: -1
      devices: [nvidia.com/gpu=all]
      volumes:
        - ${RESOURCE_DATA}:/home/x/.cache/huggingface
      secrets:
        - {source: huggingface_token, uid: '5230', gid: '5230', mode: 0400}
      restart: unless-stopped

  chatbox:
    hosts: [gpu-h100]
    tunnel_ports: [8080, 8008]
    container:
      image: ghcr.io/curoky/codespace:service-chatbox
      platform: linux/amd64
      pull_policy: always
      network_mode: bridge
      restart: unless-stopped

tokens:
  github: masked
  gitlab: masked

secrets:
  github_token_public_read: masked
  github_token_all_read: masked
  github_token_all_action_rw: masked

  codespace_root_password: masked
  codespace_workspace_key: masked
  atuin_credentials: masked

  huggingface_token: masked
  github_action_token: masked
