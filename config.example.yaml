# Copy to ~/.config/codespace/config.yaml and fill in private values.

hosts:
  server:
    forward_environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    platform: linux/amd64

project_defaults:
  image: ghcr.io/curoky/codespace:workspace-debian13
  tunnel_ports: [8005, 8007, 8008]
  container:
    secrets:
      - source: atuin_db_uri
        mode: 0400
      - source: github_action_token
        uid: "5230"
        gid: "5230"
        mode: 0400
    cap_add: [NET_RAW, SYS_ADMIN]
    security_opt: [disable, seccomp=unconfined]
    pids_limit: -1
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /etc/krb5.conf:/etc/krb5.conf:ro

projects:
  codespace:
    description: Personal development platform
    source:
      type: github
      repository: curoky/codespace
    hosts:
      server: {}
    checkout_path: /workspace/codespace
    open_path: /workspace/codespace
    encrypted: false

services:
  support:
    image: ghcr.io/curoky/codespace:service-support
    hosts:
      server: {}
    container:
      network_mode: bridge
      volumes:
        - /run/podman/podman.sock:/run/podman/podman.sock

  vllm:
    image: ghcr.io/curoky/codespace:service-vllm
    hosts:
      server: {}
    container:
      network_mode: bridge
      ports:
        - { target: 8003, published: 8003, host_ip: 10.88.0.1 }
      ipc: host
      devices: [nvidia.com/gpu=all]
      environment:
        HF_HOME: /root/.cache/huggingface
        SERVE_HOST: 0.0.0.0
        SERVE_PORT: "8003"
      volumes:
        - ${SERVICE_DATA}:/root/.cache/huggingface

  sglang:
    image: ghcr.io/curoky/codespace:service-sglang
    hosts:
      server: {}
    container:
      network_mode: bridge
      ports:
        - { target: 8003, published: 8003, host_ip: 10.88.0.1 }
      ipc: host
      devices: [nvidia.com/gpu=all]
      environment:
        HF_HOME: /root/.cache/huggingface
        SERVE_HOST: 0.0.0.0
        SERVE_PORT: "8003"
      volumes:
        - ${SERVICE_DATA}:/root/.cache/huggingface

tokens: {}
secrets: {}
