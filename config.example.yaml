# Copy to ~/.config/codespace/config.yaml and fill in private values.

hosts:
  server:
    forward_environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    platform: linux/amd64

project_defaults:
  image: ghcr.io/curoky/codespace:workspace-debian13
  tunnel_ports: [8005, 8007, 8008]
  container:
    environment:
      CODESPACE_ENCRYPTED_PATH: /workspace.enc
    secrets:
      - source: atuin_db_uri
        mode: 0400
      - source: github_action_token
        uid: "5230"
        gid: "5230"
        mode: 0400
    cap_add: [NET_RAW, SYS_ADMIN]
    security_opt: [disable, seccomp=unconfined]
    pids_limit: -1
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${RESOURCE_DATA}/workspace:/workspace
      - ${RESOURCE_DATA}/upload:/upload
      - ${RESOURCE_DATA}/control:/run/codespace-control
      - ${RESOURCE_DATA}/cache/.vscode-server/bin:/home/x/.vscode-server/bin
      - ${RESOURCE_DATA}/cache/.vscode-server/extensions:/home/x/.vscode-server/extensions
      - ${RESOURCE_DATA}/cache/.trae/bin:/home/x/.trae/bin
      - ${RESOURCE_DATA}/cache/.trae/extensions:/home/x/.trae/extensions
      - ${RESOURCE_DATA}/cache/.trae-cn/bin:/home/x/.trae-cn/bin
      - ${RESOURCE_DATA}/cache/.trae-cn/extensions:/home/x/.trae-cn/extensions
      - ${RESOURCE_DATA}/cache/.trae-server/bin:/home/x/.trae-server/bin
      - ${RESOURCE_DATA}/cache/.trae-server/extensions:/home/x/.trae-server/extensions
      - ${RESOURCE_DATA}/cache/.trae-cn-server/bin:/home/x/.trae-cn-server/bin
      - ${RESOURCE_DATA}/cache/.trae-cn-server/extensions:/home/x/.trae-cn-server/extensions
      - /etc/krb5.conf:/etc/krb5.conf:ro

projects:
  codespace:
    description: Personal development platform
    source:
      type: github
      repository: curoky/codespace
      args: [--depth=1]
    hosts:
      server: {}
    checkout_path: /workspace/codespace
    open_path: /workspace/codespace
    encrypted: false

services:
  support:
    image: ghcr.io/curoky/codespace:service-support
    hosts:
      server: {}
    container:
      network_mode: bridge
      volumes:
        - /run/podman/podman.sock:/run/podman/podman.sock

  vllm:
    image: ghcr.io/curoky/codespace:service-vllm
    hosts:
      server: {}
    container:
      network_mode: bridge
      ports:
        - { target: 8003, published: 8003, host_ip: 10.88.0.1 }
      ipc: host
      devices: [nvidia.com/gpu=all]
      environment:
        HF_HOME: /root/.cache/huggingface
        SERVE_HOST: 0.0.0.0
        SERVE_PORT: "8003"
      volumes:
        - ${RESOURCE_DATA}:/root/.cache/huggingface

  sglang:
    image: ghcr.io/curoky/codespace:service-sglang
    hosts:
      server: {}
    container:
      network_mode: bridge
      ports:
        - { target: 8003, published: 8003, host_ip: 10.88.0.1 }
      ipc: host
      devices: [nvidia.com/gpu=all]
      environment:
        HF_HOME: /root/.cache/huggingface
        SERVE_HOST: 0.0.0.0
        SERVE_PORT: "8003"
      volumes:
        - ${RESOURCE_DATA}:/root/.cache/huggingface

  lobehub:
    image: ghcr.io/curoky/codespace:service-lobehub
    hosts:
      server: {}
    container:
      network_mode: bridge
      ports:
        - { target: 3210, published: 3210, host_ip: 127.0.0.1 }
      environment:
        LOBEHUB_HOST: 0.0.0.0
        APP_URL: http://localhost:3210
        OPENAI_PROXY_URL: http://10.88.0.1:8003/v1
      volumes:
        - ${RESOURCE_DATA}:/var/lib/codespace/lobehub

  chatbox:
    image: ghcr.io/curoky/codespace:service-chatbox
    hosts:
      server: {}
    container:
      network_mode: bridge
      ports:
        - { target: 3212, published: 3212, host_ip: 127.0.0.1 }
      environment:
        CHATBOX_API_UPSTREAM: http://10.88.0.1:8003

tokens: {}
secrets: {}
