pre-commit:
  parallel: true
  jobs:
    - name: python-format
      glob: '*.py'
      run: uv run ruff format --check --no-cache --force-exclude {staged_files}

    - name: python-lint
      glob: '*.py'
      run: uv run ruff check --no-cache --force-exclude {staged_files}

    - name: shell-format
      glob: '*.{sh,bats}'
      run: shfmt -d -i 2 -ci {staged_files}

    - name: shell-lint
      glob: '*.{sh,bats}'
      run: shellcheck {staged_files}

pre-push:
  jobs:
    - name: full-check
      run: task check:full

commit-msg:
  commands:
    check-git-author:
      run: scripts/hooks/check-author.sh -n curoky -e cccuroky@gmail.com
