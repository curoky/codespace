[project]
name = "devspace"
version = "0.1.0"
description = "Personal development environment and local Codespace control plane"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "podman>=5.0.0",
    "PyGithub>=2.5.0",
    "cryptography>=44.0.0",
    "loguru>=0.7.2",
    "python-gitlab>=8.4.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["codespace/client/tests"]
pythonpath = ["."]
addopts = "--cov=codespace.client --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "Q", "I", "UP", "S", "SIM", "RUF", "PTH", "ANN", "C4", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and hardcoded dummy secrets.
"codespace/client/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
exclude = ["^codespace/client/tests/"]
explicit_package_bases = true
