[project]
name = "codespace"
version = "0.1.0"
description = "Personal development platform and local control plane"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "podman>=5.0.0",
    "PyGithub>=2.5.0",
    "loguru>=0.7.2",
    "python-gitlab>=8.4.0",
    "PyYAML>=6.0.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "truststore>=0.10.0",
    "typer>=0.27.1",
]

[project.scripts]
codespace = "codespace.cli:app"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "httpx2>=2.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib --cov=codespace --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "Q", "I", "UP", "S", "SIM", "RUF", "PTH", "ANN", "C4", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, hardcoded dummy secrets, and fixed socket paths.
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
strict = true
exclude = ["^tests/"]
explicit_package_bases = true
mypy_path = "src"
