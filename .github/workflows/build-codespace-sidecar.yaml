name: Build codespace sidecar image

on:
  push:
    paths:
      - '.github/workflows/build-codespace-sidecar.yaml'
      - 'images/deployments/sidecar/**'
      - 'images/dev/rootfs/etc/s6/skel/**'
      - 'images/dev/script/setup-s6.sh'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/deployments/sidecar/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/curoky/devspace:codespace-sidecar
