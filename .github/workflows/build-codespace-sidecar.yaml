name: Build codespace sidecar image

on:
  push:
    paths:
      - '.github/workflows/build-codespace-sidecar.yaml'
      - 'codespace/images/sidecar/**'
      - 'codespace/images/dev/rootfs/etc/s6/skel/**'
      - 'codespace/images/dev/script/setup-s6.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: codespace/images/sidecar/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/curoky/devspace:codespace-sidecar
