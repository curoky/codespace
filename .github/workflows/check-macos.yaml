name: Check macOS environment

on:
  pull_request:
    paths:
      - '.github/workflows/check-macos.yaml'
      - '.agents/skills/manage-macos-environment/**'
      - 'platform/macos/**'
      - 'platform/container/workspace/rootfs/home/x/**'
      - 'platform/container/workspace/tools/node-tool/**'
      - 'platform/container/workspace/tools/java-tool/**'
      - 'platform/container/workspace/go.mod'
      - 'platform/container/workspace/go.sum'
      - 'platform/container/workspace/Dockerfile'
  schedule:
    - cron: '0 4 * * 0'
  workflow_run:
    workflows: [Publish workspace tools]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: check-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CODESPACE_HOME: /Users/x
    steps:
      - uses: actions/checkout@v5

      - name: Install validation tools and declared formulae
        shell: bash
        run: |
          set -euo pipefail
          brew install bats-core shfmt
          casks="$(brew bundle list --file platform/macos/Brewfile --cask)"
          HOMEBREW_BUNDLE_CASK_SKIP="$casks" \
            brew bundle install --file platform/macos/Brewfile

      - name: Validate native contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew bundle list --file platform/macos/Brewfile --cask |
            while read -r package; do
              brew info --cask "$package" >/dev/null
            done
          find platform/macos/maintenance platform/macos/scripts \
            -type f -name '*.sh' -print0 |
            xargs -0 shellcheck
          find platform/macos/maintenance platform/macos/scripts \
            -type f -name '*.sh' -print0 |
            xargs -0 shfmt -d -i 2 -ci
          find platform/macos/rootfs -type f -name '*.plist' -print0 |
            xargs -0 -n 1 plutil -lint
          bats platform/macos/tests

      - name: Prepare fixed client home
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$CODESPACE_HOME"
          sudo chown "$(id -u):$(id -g)" "$CODESPACE_HOME"
          install -d "$CODESPACE_HOME/.local/bin"
          ln -sfn /opt/homebrew/opt/gcc/bin/gcc-16 "$CODESPACE_HOME/.local/bin/gcc"
          ln -sfn /opt/homebrew/opt/gcc/bin/g++-16 "$CODESPACE_HOME/.local/bin/g++"

      - name: Install standalone tools
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/binman.sh

      - name: Install Python
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/uv.sh

      - name: Install Python tools
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/python-tools.sh

      - name: Install Node.js
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/node-runtime.sh

      - name: Install Node.js tools
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/node-tools.sh

      - name: Install Go
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/go.sh

      - name: Install Rust
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/rust.sh

      - name: Install LLVM
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/llvm.sh

      - name: Install Java
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/java-runtime.sh

      - name: Install Java tool installer
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/java-tools.sh

      - name: Converge home configuration
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/home-links.sh

      - name: Verify installed AI assets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CODESPACE_HOME/.local/bin:$PATH"
          date -d '2026-01-01 + 1 day' +%F
          bats platform/macos/tests/ai.bats

      - name: Start Atuin daemon
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/atuin-daemon.sh

      - name: Verify native shell defaults
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          HOME="$CODESPACE_HOME" zsh -ic '
            [[ "$(python --version)" == "Python 3.15.2" ]] &&
            [[ "$(python3 --version)" == "Python 3.15.2" ]] &&
            [[ "$(node --version)" == v26.13.1 ]] &&
            [[ "$(go env GOVERSION)" == go1.27.4 ]] &&
            [[ "$(rustup show active-toolchain)" == 1.100.0-aarch64-apple-darwin* ]] &&
            [[ "$(java -XshowSettings:properties -version 2>&1)" == *"java.version = 27.0.1.1"* ]] &&
            [[ "$(gcc -dumpfullversion)" == 16.2.0 ]] &&
            [[ "$(llvm-config --version)" == 23.1.2 ]]
          '

      - name: Verify development environment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export JAVA_HOME="$HOME/.local/opt/java/openjdk27"
          export PATH="$HOME/.local/bin:$HOME/.local/opt/uv/bin:$HOME/.local/opt/node/tools/bin:$HOME/.local/opt/node:$HOME/.local/opt/node/nodejs26/bin:$HOME/.local/opt/go/go1.27/bin:$HOME/.local/opt/java:$HOME/.local/opt/java/tools/bin:$JAVA_HOME/bin:$PATH"

          test -x "$HOME/.local/bin/uv"
          test -x "$HOME/.local/bin/pnpm"
          test -x "$HOME/.local/bin/oras"
          test -x "$HOME/.local/opt/uv/bin/python3.15"
          test -x "$HOME/.local/opt/node/nodejs24/bin/node"
          test -x "$HOME/.local/opt/node/nodejs26/bin/node"
          test -x "$HOME/.local/opt/node/tools/bin/prettier"
          test -x "$HOME/.local/opt/go/go1.27/bin/go"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"
          test ! -e "$HOME/.local/opt/java/openjdk8"
          test -L "$HOME/.zshrc"

          uv --version
          pnpm --version
          oras version
          python3.15 --version
          test "$(python --version)" = 'Python 3.15.2'
          test "$(python3 --version)" = 'Python 3.15.2'
          node --version
          "$HOME/.local/opt/node/nodejs24/bin/node" --version
          node-tool --help
          prettier --version
          defuddle --help >/dev/null
          markdownlint-cli2 --version
          go version
          java -version
          javac -version
          java-tool --help

          test "$(command -v uv)" = "$HOME/.local/bin/uv"
          test "$(command -v python3.15)" = "$HOME/.local/opt/uv/bin/python3.15"
          test "$(command -v python)" = "$HOME/.local/opt/uv/bin/python"
          test "$(command -v python3)" = "$HOME/.local/opt/uv/bin/python3"
          test "$(command -v pnpm)" = "$HOME/.local/bin/pnpm"
          test "$(command -v node)" = "$HOME/.local/opt/node/nodejs26/bin/node"
          test "$(command -v node-tool)" = "$HOME/.local/opt/node/node-tool"
          test "$(command -v prettier)" = "$HOME/.local/opt/node/tools/bin/prettier"
          test "$(command -v defuddle)" = "$HOME/.local/opt/node/tools/bin/defuddle"
          test "$(command -v markdownlint-cli2)" = "$HOME/.local/opt/node/tools/bin/markdownlint-cli2"
          test "$(command -v go)" = "$HOME/.local/opt/go/go1.27/bin/go"
          test "$(command -v java)" = "$JAVA_HOME/bin/java"
          test "$(command -v java-tool)" = "$HOME/.local/opt/java/java-tool"

          domain="gui/$(id -u)"
          launchctl print "$domain/sh.atuin.daemon" >/dev/null
          atuin daemon status
          test -S "$HOME/.local/share/atuin/atuin.sock"

      - name: Verify native Go SDK and user binary separation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export PATH="$HOME/.local/opt/go/go1.27/bin:$PATH"
          test "$(go env GOROOT)" -ef "$HOME/.local/opt/go/go1.27"
          test "$(go env GOVERSION)" = go1.27.4
          test "$(go env GOPATH)" = "$HOME/go"
          "$HOME/.local/opt/uv/bin/python3.15" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          settings = Path("platform/macos/rootfs/Users/x/Library/Application Support/Code/User/settings.json").read_text()
          tools = json.loads(re.search(r'"go.alternateTools":\s*({[^}]+})', settings).group(1))
          for name, path in tools.items():
              assert os.access(path, os.X_OK), f"missing editor tool: {name}: {path}"
          PY
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          cd "$work_dir"
          go mod init example.com/codespace-smoke
          printf 'package main\nimport "fmt"\nfunc main() { fmt.Println("codespace") }\n' >main.go
          gofmt -w main.go
          test -z "$(gofmt -l main.go)"
          GOPROXY=off go run .
          GOPROXY=off go install .
          test "$("$HOME/go/bin/codespace-smoke")" = codespace
          test ! -e "$HOME/.local/opt/go/go1.27/bin/codespace-smoke"

      - name: Verify native managed Python and isolated tools
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export UV_TOOL_DIR="$HOME/.local/opt/uv/tools"
          export UV_TOOL_BIN_DIR="$HOME/.local/opt/uv/bin"
          export UV_PYTHON_INSTALL_DIR="$HOME/.local/opt/uv/python"
          export UV_PYTHON_BIN_DIR="$HOME/.local/opt/uv/bin"
          export PATH="$HOME/.local/bin:$UV_PYTHON_BIN_DIR:$PATH"
          work_dir="$(mktemp -d)"
          trap 'uv tool uninstall cowsay; rm -rf "$work_dir"' EXIT
          uv venv --managed-python --no-python-downloads --python 3.15.2 "$work_dir/venv"
          "$work_dir/venv/bin/python" -c 'import ssl, ctypes, sqlite3; print(ssl.OPENSSL_VERSION)'
          uv tool install cowsay --python "$UV_PYTHON_BIN_DIR/python3.15"
          "$UV_TOOL_BIN_DIR/cowsay" -t codespace >/dev/null
          test -f "$UV_TOOL_DIR/cowsay/uv-receipt.toml"

      - name: Verify native Python CLI ownership and binding
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export PATH="$HOME/.local/opt/uv/bin:$HOME/.local/bin:$PATH"
          platform/macos/maintenance/python-tools.sh
          copyparty --help >/dev/null
          licenseheaders --help >/dev/null
          netron --help >/dev/null
          mitmdump --version
          git-filter-repo --version
          test ! -e "$HOME/.local/opt/uv/bin/dool"
          test ! -e "$HOME/.local/opt/uv/bin/tensorboard"
          python3.15 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          root = Path.home() / ".local/opt/uv"
          for package in ("copyparty", "licenseheaders", "netron", "mitmproxy", "git-filter-repo"):
              environment = root / "tools" / package
              receipt = tomllib.loads((environment / "uv-receipt.toml").read_text())
              for entrypoint in receipt["tool"]["entrypoints"]:
                  launcher = root / "bin" / entrypoint["name"]
                  assert launcher.samefile(environment / "bin" / entrypoint["name"])
                  assert Path(entrypoint["install-path"]) == launcher
              subprocess.run(
                  [str(environment / "bin/python"), "-c",
                   "import sys; from pathlib import Path; "
                   "assert sys.version_info[:3] == (3, 15, 2); "
                   f"assert Path(sys.base_prefix).is_relative_to({str(root / 'python')!r})"],
                  check=True,
              )
          PY

      - name: Verify native Rust SDK and user Cargo separation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export CARGO_HOME="$HOME/.cargo"
          export RUSTUP_HOME="$HOME/.local/opt/rust/rustup"
          export PATH="$HOME/.local/opt/rust/cargo/bin:$PATH"
          test "$(command -v rustc)" = "$HOME/.local/opt/rust/cargo/bin/rustc"
          rustc --version | grep -F 'rustc 1.100.0 '
          test "$(rustc --print sysroot)" = "$RUSTUP_HOME/toolchains/1.100.0-aarch64-apple-darwin"
          rust-analyzer --version
          components="$(rustup component list --installed)"
          for component in cargo clippy llvm-tools rust-analyzer rust-src rust-std rustc rustfmt; do
            printf '%s\n' "$components" | grep -Eq "^${component}(-[^ ]+)?$"
          done
          test "$(printf '%s\n' "$components" | wc -l | tr -d ' ')" = 8
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          cargo new --vcs none --name codespace_smoke "$work_dir/project"
          cd "$work_dir/project"
          cargo run --offline
          cargo fmt --check
          cargo clippy --offline -- -D warnings
          cargo install --offline --path .
          test -x "$CARGO_HOME/bin/codespace_smoke"
          test ! -e "$HOME/.local/opt/rust/cargo/bin/codespace_smoke"
          "$CARGO_HOME/bin/codespace_smoke"
          cargo uninstall codespace_smoke

      - name: Verify native LLVM and GNU GCC
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export PATH="$HOME/.local/bin:$HOME/.local/opt/llvm/llvm23/bin:$PATH"
          test "$(llvm-config --prefix)" -ef "$HOME/.local/opt/llvm/llvm23"
          test "$(llvm-config --version)" = 23.1.2
          test "$(gcc -dumpfullversion)" = 16.2.0
          test "$(command -v gcc)" = "$HOME/.local/bin/gcc"
          test "$(command -v clang)" = "$HOME/.local/opt/llvm/llvm23/bin/clang"
          clang --version
          clang-format --version
          clangd --version
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          printf 'int main(void) { return 0; }\n' >"$work_dir/main.c"
          clang -isysroot "$(xcrun --sdk macosx --show-sdk-path)" "$work_dir/main.c" -o "$work_dir/main"
          "$work_dir/main"
          gcc "$work_dir/main.c" -o "$work_dir/main-gcc"
          "$work_dir/main-gcc"
          printf 'int main() { return 0; }\n' >"$work_dir/main.cpp"
          g++ "$work_dir/main.cpp" -o "$work_dir/main-g++"
          "$work_dir/main-g++"
          clang++ -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            "$work_dir/main.cpp" -o "$work_dir/main-clang++"
          "$work_dir/main-clang++"
          clang-format --dry-run --Werror "$work_dir/main.c"

      - name: Verify native Node tool binding and relocation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export PATH="$HOME/.local/bin:$PATH"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          mkdir "$work_dir/package"
          printf '%s\n' '{"name":"node-tool-smoke","version":"1.0.0","bin":{"node-tool-smoke":"cli.js"}}' \
            >"$work_dir/package/package.json"
          printf '%s\n' '#!/usr/bin/env node' \
            'console.log(process.execPath);' >"$work_dir/package/cli.js"
          chmod 0755 "$work_dir/package/cli.js"
          tar -czf "$work_dir/smoke.tgz" -C "$work_dir" package
          "$HOME/.local/opt/node/node-tool" install "$work_dir/smoke.tgz" \
            --root "$work_dir/tools"
          mv "$work_dir/tools" "$work_dir/relocated"
          test "$(PATH="$HOME/.local/opt/node/nodejs24/bin:/usr/bin:/bin" \
            "$work_dir/relocated/bin/node-tool-smoke")" = "$HOME/.local/opt/node/nodejs26/bin/node"

      - name: Verify native Java tool binding and relocation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export JAVA_HOME="$HOME/.local/opt/java/openjdk27"
          export PATH="$HOME/.local/opt/java:$HOME/.local/bin:$JAVA_HOME/bin:$PATH"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          cat >"$work_dir/JavaToolSmoke.java" <<'JAVA'
          public class JavaToolSmoke {
              public static void main(String[] args) {
                  System.out.println(System.getProperty("java.home"));
              }
          }
          JAVA
          mkdir "$work_dir/classes"
          javac -d "$work_dir/classes" "$work_dir/JavaToolSmoke.java"
          jar --create --file "$work_dir/smoke.jar" --main-class JavaToolSmoke \
            -C "$work_dir/classes" .
          mkdir -p "$work_dir/repository/smoke/app/1"
          mv "$work_dir/smoke.jar" "$work_dir/repository/smoke/app/1/app-1.jar"
          cat >"$work_dir/repository/smoke/app/1/app-1.pom" <<'POM'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>smoke</groupId><artifactId>app</artifactId><version>1</version>
          </project>
          POM
          "$HOME/.local/opt/java/java-tool" install smoke@1 smoke:app:1 \
            --repository "file://$work_dir/repository" --main smoke=JavaToolSmoke \
            --root "$work_dir/tools"
          mv "$work_dir/tools" "$work_dir/relocated"
          test "$(JAVA_HOME=/missing PATH="$HOME/.local/bin:/usr/bin:/bin" \
            "$work_dir/relocated/bin/smoke")" = "$JAVA_HOME"
