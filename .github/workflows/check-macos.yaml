name: Check macOS environment

on:
  push:
    paths:
      - '.github/workflows/check-macos.yaml'
      - '.agents/skills/manage-macos-environment/**'
      - 'platform/macos/**'
      - 'platform/container/workspace/rootfs/home/x/**'
      - 'platform/container/workspace/tools/node-tool/**'
      - 'platform/container/workspace/tools/java-tool/**'
      - 'platform/container/workspace/Dockerfile'
  pull_request:
    paths:
      - '.github/workflows/check-macos.yaml'
      - '.agents/skills/manage-macos-environment/**'
      - 'platform/macos/**'
      - 'platform/container/workspace/rootfs/home/x/**'
      - 'platform/container/workspace/tools/node-tool/**'
      - 'platform/container/workspace/tools/java-tool/**'
      - 'platform/container/workspace/Dockerfile'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: check-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CODESPACE_HOME: /Users/x
    steps:
      - uses: actions/checkout@v5

      - name: Install validation tools and declared formulae
        shell: bash
        run: |
          set -euo pipefail
          brew install bats-core shfmt
          casks="$(brew bundle list --file platform/macos/Brewfile --cask)"
          HOMEBREW_BUNDLE_CASK_SKIP="$casks" \
            brew bundle install --file platform/macos/Brewfile --no-upgrade

      - name: Validate native contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew bundle list --file platform/macos/Brewfile --cask |
            while read -r package; do
              brew info --cask "$package" >/dev/null
            done
          find platform/macos/maintenance platform/macos/scripts \
            -type f -name '*.sh' -print0 |
            xargs -0 shellcheck
          find platform/macos/maintenance platform/macos/scripts \
            -type f -name '*.sh' -print0 |
            xargs -0 shfmt -d -i 2 -ci
          find platform/macos/rootfs -type f -name '*.plist' -print0 |
            xargs -0 -n 1 plutil -lint
          bats platform/macos/tests

      - name: Prepare fixed client home
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$CODESPACE_HOME"
          sudo chown "$(id -u):$(id -g)" "$CODESPACE_HOME"

      - name: Install standalone tools
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/binman.sh

      - name: Install Python
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/uv.sh

      - name: Install Node.js
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/node-runtime.sh

      - name: Install Node.js tools
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/node-tools.sh

      - name: Install Go
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/go.sh

      - name: Install Java
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/java-runtime.sh

      - name: Install Java tool installer
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/java-tools.sh

      - name: Converge home configuration
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/home-links.sh

      - name: Start Atuin daemon
        if: github.event_name != 'pull_request'
        run: HOME="$CODESPACE_HOME" platform/macos/maintenance/atuin-daemon.sh

      - name: Verify development environment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export JAVA_HOME="$HOME/.local/opt/java/openjdk27"
          export PATH="$HOME/.local/bin:$HOME/.local/share/uv/bin:$HOME/.local/opt/node/tools/bin:$HOME/.local/opt/node/node-tool:$HOME/.local/opt/node/nodejs26/bin:$HOME/.local/share/go/go1.27.1/bin:$HOME/.local/opt/java/java-tool:$HOME/.local/opt/java/tools/bin:$JAVA_HOME/bin:$PATH"

          test -x "$HOME/.local/bin/uv"
          test -x "$HOME/.local/bin/pnpm"
          test -x "$HOME/.local/share/uv/bin/python3.14"
          test -x "$HOME/.local/opt/node/nodejs24/bin/node"
          test -x "$HOME/.local/opt/node/nodejs26/bin/node"
          test -x "$HOME/.local/opt/node/tools/bin/prettier"
          test -x "$HOME/.local/share/go/go1.27.1/bin/go"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"
          test ! -e "$HOME/.local/opt/java/openjdk8"
          test -L "$HOME/.zshrc"

          uv --version
          pnpm --version
          python3.14 --version
          node --version
          "$HOME/.local/opt/node/nodejs24/bin/node" --version
          node-tool --help
          prettier --version
          go version
          java -version
          javac -version
          java-tool --help

          test "$(command -v uv)" = "$HOME/.local/bin/uv"
          test "$(command -v pnpm)" = "$HOME/.local/bin/pnpm"
          test "$(command -v node)" = "$HOME/.local/opt/node/nodejs26/bin/node"
          test "$(command -v node-tool)" = "$HOME/.local/opt/node/node-tool/node-tool"
          test "$(command -v prettier)" = "$HOME/.local/opt/node/tools/bin/prettier"
          test "$(command -v go)" = "$HOME/.local/share/go/go1.27.1/bin/go"
          test "$(command -v java)" = "$JAVA_HOME/bin/java"
          test "$(command -v java-tool)" = "$HOME/.local/opt/java/java-tool/java-tool"

          domain="gui/$(id -u)"
          launchctl print "$domain/sh.atuin.daemon" >/dev/null
          atuin daemon status
          test -S "$HOME/.local/share/atuin/atuin.sock"

      - name: Verify native Node tool binding and relocation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          mkdir "$work_dir/package"
          printf '%s\n' '{"name":"node-tool-smoke","version":"1.0.0","bin":{"node-tool-smoke":"cli.js"}}' \
            >"$work_dir/package/package.json"
          printf '%s\n' '#!/usr/bin/env node' \
            'console.log(process.execPath);' >"$work_dir/package/cli.js"
          chmod 0755 "$work_dir/package/cli.js"
          tar -czf "$work_dir/smoke.tgz" -C "$work_dir" package
          "$HOME/.local/opt/node/node-tool/node-tool" install "$work_dir/smoke.tgz" \
            --node "$HOME/.local/opt/node/nodejs26" --pnpm "$HOME/.local/bin/pnpm" \
            --root "$work_dir/tools"
          mv "$work_dir/tools" "$work_dir/relocated"
          test "$(PATH="$HOME/.local/opt/node/nodejs24/bin:/usr/bin:/bin" \
            "$work_dir/relocated/bin/node-tool-smoke")" = "$HOME/.local/opt/node/nodejs26/bin/node"

      - name: Verify native Java tool binding and relocation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$CODESPACE_HOME"
          export JAVA_HOME="$HOME/.local/opt/java/openjdk27"
          export PATH="$HOME/.local/bin:$JAVA_HOME/bin:$PATH"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          cat >"$work_dir/JavaToolSmoke.java" <<'JAVA'
          public class JavaToolSmoke {
              public static void main(String[] args) {
                  System.out.println(System.getProperty("java.home"));
              }
          }
          JAVA
          mkdir "$work_dir/classes"
          javac -d "$work_dir/classes" "$work_dir/JavaToolSmoke.java"
          jar --create --file "$work_dir/smoke.jar" --main-class JavaToolSmoke \
            -C "$work_dir/classes" .
          "$HOME/.local/opt/java/java-tool/java-tool" install smoke@1 "$work_dir/smoke.jar" \
            --jar smoke=smoke.jar --java "$JAVA_HOME" --root "$work_dir/tools"
          mv "$work_dir/tools" "$work_dir/relocated"
          test "$(JAVA_HOME=/missing PATH="$HOME/.local/bin:/usr/bin:/bin" \
            "$work_dir/relocated/bin/smoke")" = "$JAVA_HOME"
