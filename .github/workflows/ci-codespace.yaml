name: CI codespace

on:
  push:
    paths:
      - '.github/workflows/ci-codespace.yaml'
      - 'Taskfile.yaml'
      - 'controller/**'
      - 'images/dev/Dockerfile'
      - 'images/dev/rootfs/etc/s6/s6-rc.d/**'
      - 'images/dev/rootfs/opt/codespace/**'
      - 'images/dev/tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/workflows/ci-codespace.yaml'
      - 'Taskfile.yaml'
      - 'controller/**'
      - 'images/dev/Dockerfile'
      - 'images/dev/rootfs/etc/s6/s6-rc.d/**'
      - 'images/dev/rootfs/opt/codespace/**'
      - 'images/dev/tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: |
          uv sync --locked --dev
          uv sync \
            --project images/dev/rootfs/opt/codespace \
            --locked \
            --no-dev

      - name: Install shell tools
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install bats-core shellcheck shfmt
          echo "${HOMEBREW_PREFIX}/bin" >>"${GITHUB_PATH}"

      - name: Format check
        run: |
          uv run ruff format --check \
            --config pyproject.toml \
            controller \
            images/dev/rootfs/opt/codespace/workspace_agent.py
          shfmt -d -i 2 -s -ci \
            images/dev/rootfs/opt/codespace/bin/* \
            images/dev/tests/*.bats

      - name: Lint
        run: |
          uv run ruff check \
            --config pyproject.toml \
            controller \
            images/dev/rootfs/opt/codespace/workspace_agent.py
          shellcheck \
            images/dev/rootfs/opt/codespace/bin/* \
            images/dev/tests/*.bats

      - name: Type check
        run: |
          MYPYPATH=images/dev/rootfs/opt/codespace uv run mypy \
            controller \
            images/dev/rootfs/opt/codespace/workspace_agent.py
          uv run \
            --project images/dev/rootfs/opt/codespace \
            --locked \
            python -c \
            "import sys; sys.path.insert(0, 'images/dev/rootfs/opt/codespace'); import workspace_agent"

      - name: Test
        run: |
          uv run pytest
          bats images/dev/tests/*.bats
