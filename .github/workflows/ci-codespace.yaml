name: CI codespace

on:
  push:
    paths:
      - '.github/workflows/ci-codespace.yaml'
      - 'Taskfile.yaml'
      - 'controller/**'
      - 'images/dev/Dockerfile'
      - 'images/dev/rootfs/opt/codespace/bin/**'
      - 'images/dev/tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/workflows/ci-codespace.yaml'
      - 'Taskfile.yaml'
      - 'controller/**'
      - 'images/dev/Dockerfile'
      - 'images/dev/rootfs/opt/codespace/bin/**'
      - 'images/dev/tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked --dev

      - name: Install shell tools
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install bats-core shellcheck shfmt
          echo "${HOMEBREW_PREFIX}/bin" >>"${GITHUB_PATH}"

      - name: Format check
        run: |
          uv run ruff format --check controller
          shfmt -d -i 2 -s -ci \
            images/dev/rootfs/opt/codespace/bin/codespace-* \
            images/dev/tests/*.bats

      - name: Lint
        run: |
          uv run ruff check controller
          shellcheck \
            images/dev/rootfs/opt/codespace/bin/codespace-* \
            images/dev/tests/*.bats

      - name: Type check
        run: uv run mypy controller

      - name: Test
        run: |
          uv run pytest
          bats images/dev/tests/*.bats
