name: Clean container registry

on:
  push:
    paths:
      - '.github/workflows/cleanup-registry.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: false
          delete-untagged: true
          packages: codespace,codespace-cache
