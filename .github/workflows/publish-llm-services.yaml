name: Publish LLM service images

on:
  push:
    paths:
      - '.github/workflows/publish-llm-services.yaml'
      - 'platform/container/services/vllm/**'
      - 'platform/container/services/sglang/**'
      - 'platform/container/workspace/rootfs/etc/s6/skel/**'
      - 'platform/container/workspace/scripts/install-s6.sh'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vllm, sglang]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/curoky/codespace:service-${{ matrix.service }}
