name: Publish WSL image

on:
  push:
    paths:
      - '.github/workflows/publish-wsl.yaml'
      - 'platform/wsl/**'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      disable_docker_cache:
        description: Disable Docker cache
        default: false
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: >-
            --allow-insecure-entitlement network.host
            --allow-insecure-entitlement security.insecure
            --oci-worker-net=host

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/wsl/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          network: host
          cache-from: |
            type=registry,ref=ghcr.io/curoky/codespace-cache:workspace-wsl
            type=registry,ref=ghcr.io/curoky/codespace-cache:workspace-wsl-min
          cache-to: type=registry,ref=ghcr.io/curoky/codespace-cache:workspace-wsl${{ github.event_name == 'push' && '-min' || '' }},mode=${{ github.event_name == 'push' && 'min' || 'max' }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          build-args: BASE_IMAGE=ghcr.io/curoky/codespace:workspace-ubuntu26.04
          tags: ghcr.io/curoky/codespace:workspace-wsl

      - name: Export WSL rootfs
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/curoky/codespace:workspace-wsl'
          for arch in amd64 arm64; do
            docker pull --platform "linux/${arch}" "${image}"
            platform/wsl/export.sh "${image}" "codespace-${arch}.wsl"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: codespace-wsl
          path: codespace-*.wsl
          if-no-files-found: error
          retention-days: 7
