name: Publish service images

on:
  push:
    paths:
      - '.github/workflows/publish-services.yaml'
      - 'platform/container/services/**'
      - 'platform/container/workspace/rootfs/etc/s6/skel/**'
      - 'platform/container/workspace/scripts/install-s6.sh'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      disable_docker_cache:
        description: Disable Docker cache
        default: false
        required: false
        type: boolean

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          before = event.get('before', '')
          all_images = os.environ['EVENT_NAME'] != 'push' or not before.strip('0')
          paths = [] if all_images else subprocess.check_output(
              ['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']], text=True
          ).splitlines()
          shared = all_images or any(
              p == '.github/workflows/publish-services.yaml'
              or p.startswith('platform/container/services/s6/')
              or p.startswith('platform/container/workspace/rootfs/etc/s6/skel/')
              or p == 'platform/container/workspace/scripts/install-s6.sh'
              for p in paths
          )
          images = []
          for service, directory in [
              ('asr-scheduler', 'asr/scheduler'), ('asr-models', 'asr/models'),
              ('secret', 'secret'), ('support', 'support'), ('vllm', 'vllm'),
              ('sglang', 'sglang'), ('chatbox', 'chatbox'),
          ]:
              changed = shared or any(
                  p.startswith('platform/container/services/' + directory + '/')
                  or service.startswith('asr-') and p == 'platform/container/services/asr/protocol.py'
                  for p in paths
              )
              if changed:
                  images.append({'service': service, 'directory': directory, 'platforms': 'linux/amd64'})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': images}) + '\n')
              output.write('base=' + str(shared).lower() + '\n')
          PYTHON

  base:
    needs: changes
    if: needs.changes.outputs.base == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CACHE_MODE: ${{ github.event_name == 'push' && 'min' || 'max' }}
      CACHE_SUFFIX: ${{ github.event_name == 'push' && '-min' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/s6/Dockerfile
          push: true
          provenance: false
          # standalone-binaries intentionally does not publish the s6 stack for arm64.
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6-min
          cache-to: type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6${{ env.CACHE_SUFFIX }},mode=${{ env.CACHE_MODE }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          tags: ghcr.io/curoky/codespace:service-s6

  images:
    name: images (${{ matrix.service }})
    needs: [changes, base]
    if: >-
      always() && needs.changes.result == 'success' && needs.base.result != 'failure' &&
      needs.changes.outputs.matrix != '{"include": []}'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CACHE_MODE: ${{ github.event_name == 'push' && 'min' || 'max' }}
      CACHE_SUFFIX: ${{ github.event_name == 'push' && '-min' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/${{ matrix.directory }}/Dockerfile
          push: true
          provenance: false
          platforms: ${{ matrix.platforms }}
          cache-from: |
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}-min
          cache-to: type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}${{ env.CACHE_SUFFIX }},mode=${{ env.CACHE_MODE }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          tags: ghcr.io/curoky/codespace:service-${{ matrix.service }}
