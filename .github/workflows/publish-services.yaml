name: Publish service images

on:
  push:
    paths:
      - '.github/workflows/publish-services.yaml'
      - 'platform/container/services/**'
      - 'platform/container/workspace/rootfs/etc/s6/skel/**'
      - 'platform/container/workspace/scripts/install-s6.sh'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      disable_docker_cache:
        description: Disable Docker cache
        default: false
        required: false
        type: boolean

jobs:
  base:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CACHE_MODE: ${{ github.event_name == 'push' && 'min' || 'max' }}
      CACHE_SUFFIX: ${{ github.event_name == 'push' && '-min' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/s6/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6-min
          cache-to: type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6${{ env.CACHE_SUFFIX }},mode=${{ env.CACHE_MODE }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          tags: ghcr.io/curoky/codespace:service-s6

  images:
    name: images (${{ matrix.service }})
    needs: base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CACHE_MODE: ${{ github.event_name == 'push' && 'min' || 'max' }}
      CACHE_SUFFIX: ${{ github.event_name == 'push' && '-min' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: secret
            platforms: linux/amd64,linux/arm64
          - service: support
            platforms: linux/amd64,linux/arm64
          - service: vllm
            platforms: linux/amd64
          - service: sglang
            platforms: linux/amd64
          - service: chatbox
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          platforms: ${{ matrix.platforms }}
          cache-from: |
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}-min
          cache-to: type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}${{ env.CACHE_SUFFIX }},mode=${{ env.CACHE_MODE }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          tags: ghcr.io/curoky/codespace:service-${{ matrix.service }}
