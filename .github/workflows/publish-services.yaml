name: Publish service images

on:
  push:
    paths:
      - '.github/workflows/publish-services.yaml'
      - 'platform/container/services/**'
      - 'platform/container/workspace/rootfs/etc/s6/skel/**'
      - 'platform/container/workspace/scripts/install-s6.sh'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      disable_docker_cache:
        description: Disable Docker cache
        default: false
        required: false
        type: boolean

jobs:
  base:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/s6/Dockerfile
          push: true
          provenance: false
          # standalone-binaries intentionally does not publish the s6 stack for arm64.
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6-min
          cache-to: type=registry,ref=ghcr.io/curoky/codespace-cache:service-s6${{ github.event_name == 'push' && '-min' || '' }},mode=${{ github.event_name == 'push' && 'min' || 'max' }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          tags: ghcr.io/curoky/codespace:service-s6

  images:
    name: images (${{ matrix.service }})
    needs: base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: asr-scheduler
            directory: asr/scheduler
          - service: asr-models
            directory: asr/models
          - service: secret
            directory: secret
          - service: support
            directory: support
          - service: vllm
            directory: vllm
          - service: sglang
            directory: sglang
          - service: chatbox
            directory: chatbox
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/${{ matrix.directory }}/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}
            type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}-min
          cache-to: type=registry,ref=ghcr.io/curoky/codespace-cache:service-${{ matrix.service }}${{ github.event_name == 'push' && '-min' || '' }},mode=${{ github.event_name == 'push' && 'min' || 'max' }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          tags: ghcr.io/curoky/codespace:service-${{ matrix.service }}
