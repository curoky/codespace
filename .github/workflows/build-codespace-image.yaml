name: Build codespace images

on:
  push:
    paths:
      - '.github/workflows/build-codespace-image.yaml'
      - 'images/dev/**'
      - 'dotfiles/**'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      disable_docker_cache:
        description: 'disable docker cache'
        default: false
        required: false
        type: boolean

jobs:
  build:
    name: build (${{ matrix.image.saved_image }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    env:
      CACHE_MODE: ${{ github.event_name == 'push' && 'min' || 'max' }}
      CACHE_SUFFIX: ${{ github.event_name == 'push' && '-min' || '' }}
    strategy:
      matrix:
        image:
          - base_image: 'debian:10'
            saved_image: 'debian10'
          - base_image: 'debian:11'
            saved_image: 'debian11'
          - base_image: 'debian:12'
            saved_image: 'debian12'
          - base_image: 'debian:13'
            saved_image: 'debian13'
          # - base_image: 'ubuntu:20.04'
          #   saved_image: 'ubuntu20.04'
          # - base_image: 'ubuntu:22.04'
          #   saved_image: 'ubuntu22.04'
          # - base_image: 'ubuntu:24.04'
          #   saved_image: 'ubuntu24.04'
          - base_image: 'ubuntu:26.04'
            saved_image: 'ubuntu26.04'
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: >-
            --allow-insecure-entitlement network.host
            --allow-insecure-entitlement security.insecure
            --oci-worker-net=host
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/dev/Dockerfile
          push: true
          provenance: false
          platforms: linux/${{ matrix.platform.arch }}
          network: host
          cache-from: |
            type=registry,ref=ghcr.io/curoky/devspace-cache:codespace-${{ matrix.image.saved_image }}-${{ matrix.platform.arch }}
            type=registry,ref=ghcr.io/curoky/devspace-cache:codespace-${{ matrix.image.saved_image }}-${{ matrix.platform.arch }}-min
          cache-to: type=registry,ref=ghcr.io/curoky/devspace-cache:codespace-${{ matrix.image.saved_image }}-${{ matrix.platform.arch }}${{ env.CACHE_SUFFIX }},mode=${{ env.CACHE_MODE }},oci-mediatypes=true,compression=zstd,compression-level=3
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_docker_cache == true) }}
          build-args: BASE_IMAGE=${{ matrix.image.base_image }}
          tags: ghcr.io/curoky/devspace
          outputs: type=image,name-canonical=true,push-by-digest=true,oci-mediatypes=true,compression=zstd,compression-level=3

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid image digest: ${digest}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.saved_image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge (${{ matrix.saved_image }})
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        saved_image:
          - debian10
          - debian11
          - debian12
          - debian13
          # - ubuntu20.04
          # - ubuntu22.04
          # - ubuntu24.04
          - ubuntu26.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.saved_image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Create multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("${RUNNER_TEMP}"/digests/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "expected 2 image digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "${digest_file}")"
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "invalid image digest file: ${digest}" >&2
              exit 1
            fi
            sources+=("ghcr.io/curoky/devspace@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag ghcr.io/curoky/devspace:base-${{ matrix.saved_image }} \
            --tag ghcr.io/curoky/devspace:codespace-${{ matrix.saved_image }} \
            "${sources[@]}"

          platforms="$(
            docker buildx imagetools inspect \
              --raw ghcr.io/curoky/devspace:base-${{ matrix.saved_image }} \
              | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' \
              | sort
          )"
          expected_platforms=$'linux/amd64\nlinux/arm64'
          if [[ "${platforms}" != "${expected_platforms}" ]]; then
            echo "unexpected manifest platforms:" >&2
            printf '%s\n' "${platforms}" >&2
            exit 1
          fi
