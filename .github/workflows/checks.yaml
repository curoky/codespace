name: Checks

on:
  push:
    paths:
      - '.github/workflows/checks.yaml'
      - 'src/**'
      - 'tests/**'
      - 'platform/container/**'
      - 'platform/macos/**'
      - 'config.example.yaml'
      - 'scripts/**'
      - 'Taskfile.yaml'
      - 'lefthook.yml'
      - 'pyproject.toml'
      - '.python-version'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/workflows/checks.yaml'
      - 'src/**'
      - 'tests/**'
      - 'platform/container/**'
      - 'platform/macos/**'
      - 'config.example.yaml'
      - 'scripts/**'
      - 'Taskfile.yaml'
      - 'lefthook.yml'
      - 'pyproject.toml'
      - '.python-version'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      UV_MANAGED_PYTHON: 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: platform/container/workspace/go.mod
          cache-dependency-path: |
            platform/container/workspace/go.sum
            platform/container/workspace/tools/codex-llmbox-provider/go.sum

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install check tools
        shell: bash
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install bats-core ffmpeg go-task shellcheck shfmt
          echo "${HOMEBREW_PREFIX}/bin" >>"${GITHUB_PATH}"

      - name: Sync locked dependencies
        run: task sync

      - name: Run checks
        run: task check:full
