name: Publish LobeHub service image

on:
  push:
    paths:
      - '.github/workflows/publish-lobehub-image.yaml'
      - 'platform/container/services/lobehub/**'
      - 'platform/container/workspace/rootfs/etc/s6/skel/**'
      - 'platform/container/workspace/scripts/install-s6.sh'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/container/services/lobehub/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/curoky/codespace:service-lobehub
